<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Pop</title>
<style>
:root{--yellow:#fbbf24;--cream:#fff7d6;--pink:#ec4899;--pink-d:#be185d;--sky:#38bdf8;--ink:#1f2937;--pink-l:#fbcfe8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink);background:var(--cream);background-image:radial-gradient(#fde68a 2px,transparent 2px);background-size:26px 26px;min-height:100vh;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;max-width:760px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:26px;color:var(--pink);text-shadow:3px 3px 0 var(--sky);letter-spacing:.5px}
.logo span.e{font-size:30px;text-shadow:none;display:inline-block;animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;padding:5px 12px;font-weight:800;font-size:14px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.icon-btn{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
.tagline{text-align:center;font-weight:800;margin:0 0 14px;font-size:15px}
.card{background:#fff;border:4px solid var(--yellow);border-radius:24px;padding:16px;margin-bottom:16px;box-shadow:6px 6px 0 var(--sky)}
.card h2{margin:0 0 10px;font-size:16px;color:var(--pink-d);display:flex;align-items:center;gap:6px}
.grid{display:grid;gap:16px}
@media(min-width:720px){.grid.two{grid-template-columns:1fr 1fr;align-items:start}}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 10px;padding:0}
.chip{display:flex;align-items:center;gap:4px;background:var(--pink-l);border:3px solid var(--ink);border-radius:999px;padding:3px 6px 3px 12px;font-weight:800;animation:pop .3s}
.chip button{border:0;background:var(--ink);color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:#fffdf2}
.btn{border:3px solid var(--ink);border-radius:999px;padding:12px 26px;font-weight:900;font-size:18px;cursor:pointer;background:var(--sky);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.pink{background:var(--pink-d);color:#fff}
.btn.yellow{background:var(--yellow)}
.btn.small{padding:8px 16px;font-size:15px}
.btn.ghost{background:#fff}
.msg{min-height:22px;font-size:14px;font-weight:700;color:var(--pink-d);margin:6px 2px 0}
.times{display:flex;gap:8px;flex-wrap:wrap}
.times button{flex:1;min-width:64px;border:3px solid var(--ink);border-radius:14px;padding:8px;font-weight:800;background:#fff;cursor:pointer}
.times button[aria-pressed=true]{background:var(--yellow);box-shadow:0 3px 0 var(--ink)}
.wheelwrap{position:relative;width:min(300px,80vw);margin:6px auto 0}
.wheelwrap svg{display:block;width:100%;height:auto;transition:transform 4.2s cubic-bezier(.15,.7,.1,1);filter:drop-shadow(5px 5px 0 var(--sky))}
.pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:32px;line-height:1;filter:drop-shadow(0 2px 0 #fff);z-index:2;color:var(--pink-d)}
.hub{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px}
.topic{background:#fff;border:4px solid var(--yellow);border-radius:24px;padding:18px 14px;text-align:center;font-size:22px;font-weight:900;box-shadow:6px 6px 0 var(--sky);min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.topic .em{font-size:36px}
.topic.hint{font-size:17px;color:#6b7280;font-weight:800}
.topic.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.center{text-align:center}
.mt{margin-top:14px}
.label{font-size:14px;font-weight:800;color:var(--pink-d);margin-top:18px;text-align:center}
.speaker{font-size:34px;font-weight:900;text-align:center;word-break:break-word}
.ringwrap{position:relative;width:200px;margin:8px auto}
.ringwrap svg{width:100%;display:block}
.ringnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:62px;font-weight:900;line-height:1}
.ringnum small{font-size:13px;font-weight:800;color:#6b7280;margin-top:2px}
.ringwrap.hurry .ringnum{color:var(--pink-d);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.order{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.order span{padding:3px 12px;border-radius:999px;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:14px;opacity:.7}
.order span.now{background:var(--pink);color:#fff;opacity:1;transform:scale(1.08)}
.order span.done{background:#e5e7eb;text-decoration:line-through}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(31,41,55,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov{background:var(--cream);border:5px solid var(--ink);border-radius:28px;padding:26px 20px;text-align:center;max-width:380px;width:100%;box-shadow:8px 8px 0 var(--pink);animation:pop .45s}
.ov .big{font-size:76px;line-height:1}
.ov h3{margin:6px 0;font-size:32px;font-weight:900;color:var(--pink-d);text-shadow:2px 2px 0 var(--sky)}
.ov p{margin:6px 0 18px;font-size:18px;font-weight:700}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="e" aria-hidden="true">🎉</span><span data-i18n="title">Topic Pop</span></div>
  <div class="tools">
    <button class="icon-btn" id="soundBtn" data-demo="sound-toggle" aria-pressed="true">🔊</button>
    <div class="lang" data-demo="lang-switch" role="group" aria-label="Language">
      <button data-lang="ja" data-demo="lang-ja" aria-pressed="false">日本語</button>
      <button data-lang="en" data-demo="lang-en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main>
  <p class="tagline" data-i18n="tagline"></p>

  <!-- HOME -->
  <section id="home" class="grid two">
    <div>
      <div class="card">
        <h2>👨‍👩‍👧 <span data-i18n="playersH"></span></h2>
        <ul class="chips" id="chips" data-demo="player-list"></ul>
        <form class="addrow" id="addForm">
          <input id="nameIn" data-demo="player-input" maxlength="12" autocomplete="off" data-i18n-ph="namePh" data-i18n-aria="namePh">
          <button type="submit" class="btn yellow small" data-demo="player-add" data-i18n="add"></button>
        </form>
        <div class="msg" id="msg" role="status" aria-live="polite" data-demo="message"></div>
      </div>
      <div class="card">
        <h2>⏱️ <span data-i18n="timeH"></span></h2>
        <div class="times" id="times" data-demo="time-select">
          <button data-sec="15" data-demo="time-15"></button>
          <button data-sec="30" data-demo="time-30"></button>
          <button data-sec="45" data-demo="time-45"></button>
          <button data-sec="60" data-demo="time-60"></button>
        </div>
      </div>
    </div>
    <div class="card center">
      <h2 style="justify-content:center">🎡 <span data-i18n="wheelH"></span></h2>
      <div class="wheelwrap">
        <div class="pointer" aria-hidden="true">▼</div>
        <svg id="wheel" viewBox="0 0 200 200" data-demo="wheel" role="img" data-i18n-aria="wheelAria"></svg>
        <div class="hub" aria-hidden="true">🎉</div>
      </div>
      <div class="mt"><button class="btn pink" id="spinBtn" data-demo="spin"></button></div>
      <div class="mt topic hint" id="topicBox" data-demo="topic-result" aria-live="polite"></div>
      <div class="mt hidden" id="startWrap"><button class="btn yellow" id="startTalk" data-demo="start-talk" data-i18n="startTalk"></button></div>
    </div>
  </section>

  <!-- TALK -->
  <section id="talk" class="hidden" style="max-width:480px;margin:0 auto">
    <div class="topic" id="talkTopic" data-demo="talk-topic"></div>
    <div class="label" data-i18n="talkNow"></div>
    <div class="speaker" id="speaker" data-demo="speaker"></div>
    <div class="ringwrap" id="ringWrap" data-demo="timer">
      <svg viewBox="0 0 140 140" aria-hidden="true">
        <circle cx="70" cy="70" r="60" fill="#fff" stroke="#fbcfe8" stroke-width="12"/>
        <circle id="ring" cx="70" cy="70" r="60" fill="none" stroke="#ec4899" stroke-width="12" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="0" transform="rotate(-90 70 70)"/>
      </svg>
      <div class="ringnum"><span id="num">30</span><small data-i18n="sec"></small></div>
    </div>
    <div class="row">
      <button class="btn ghost small" id="pauseBtn" data-demo="pause"></button>
      <button class="btn pink" id="nextBtn" data-demo="next-speaker" data-i18n="next"></button>
    </div>
    <div class="order" id="order" data-demo="order"></div>
    <div class="center mt"><button class="btn ghost small" id="quitBtn" data-demo="quit" data-i18n="quit"></button></div>
  </section>
</main>

<div class="overlay hidden" id="overlay" data-demo="timeup-overlay" role="dialog" aria-live="assertive">
  <div class="ov">
    <div class="big" id="ovIcon">⏰</div>
    <h3 id="ovTitle"></h3>
    <p id="ovText"></p>
    <button class="btn pink" id="ovBtn" data-demo="timeup-next"></button>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
const I18N = {
ja:{
 title:"Topic Pop", tagline:"好きなことで、みんなで盛り上がろう",
 playersH:"話す人", namePh:"名前を入れてね", add:"追加",
 removeAria:"{n}を消す", timeH:"1人の持ち時間", secs:"{n}秒", sec:"秒",
 wheelH:"今日のお題", wheelAria:"お題ルーレット", spin:"まわす！", spinning:"まわってる…", spinAgain:"もう一回まわす",
 hint:"ルーレットをまわしてお題を決めよう！", startTalk:"このお題で話す！ 🎤",
 talkNow:"いま話す人", pause:"一時停止", resume:"再開", next:"次の人へ →", quit:"やめてもどる",
 timeup:"タイムアップ！", early:"おつかれさま！", thanks:"{n}、ありがとう 👏",
 nextTurn:"次は{n}の番 →", allDone:"みんな話せたね！", allDoneText:"最高のお話でした 🎉", again:"もう一回まわす 🎡",
 sndOn:"音を消す", sndOff:"音を出す", needName:"名前を入れてね", maxP:"最大8人までだよ", dup:"同じ名前がいるよ", minP:"1人以上は必要だよ",
 defaultPlayers:["ママ","パパ","ゆう"],
 topics:["最近ハマってることは？","人生で一番おいしかったもの","おすすめの映画・ドラマは？","よく聴く曲・好きな歌手","行ってみたい場所は？","子どもの頃に夢中だったこと","好きな動物とその理由","休みの日の最高の過ごし方","ちょっと自慢できる特技","最近買ってよかったもの"]
},
en:{
 title:"Topic Pop", tagline:"Have fun together talking about what you love!",
 playersH:"Players", namePh:"Type a name", add:"Add",
 removeAria:"Remove {n}", timeH:"Time per person", secs:"{n} sec", sec:"sec",
 wheelH:"Today's topic", wheelAria:"Topic roulette", spin:"Spin!", spinning:"Spinning…", spinAgain:"Spin again",
 hint:"Spin the wheel to pick a topic!", startTalk:"Talk about this! 🎤",
 talkNow:"Now speaking", pause:"Pause", resume:"Resume", next:"Next person →", quit:"Quit",
 timeup:"Time's up!", early:"Nice one!", thanks:"Thank you, {n}! 👏",
 nextTurn:"{n}'s turn next →", allDone:"Everyone had a turn!", allDoneText:"What great stories! 🎉", again:"Spin again 🎡",
 sndOn:"Mute sound", sndOff:"Turn sound on", needName:"Please type a name", maxP:"Up to 8 players", dup:"That name is already in", minP:"You need at least 1 player",
 defaultPlayers:["Mom","Dad","Yu"],
 topics:["Something you're into lately","The best thing you ever ate","A movie or show you recommend","A song or artist you love","A place you want to visit","What you loved as a kid","Favorite animal and why","Your perfect day off","A small talent you're proud of","Best thing you bought lately"]
}};
const EMOJI=["🎮","🍜","🎬","🎵","✈️","🧸","🐶","🏖️","🧩","🛍️"];
const COLORS=["#fbbf24","#ec4899","#38bdf8"];
const $=s=>document.querySelector(s);

/* ---------- state ---------- */
let lang="en";
(function(){
  let l=null;
  if(window.APP_LANG==="ja"||window.APP_LANG==="en") l=window.APP_LANG;
  if(!l){try{const q=new URLSearchParams(location.search).get("lang");if(q==="ja"||q==="en")l=q;}catch(e){}}
  if(!l){try{const s=localStorage.getItem("lang");if(s==="ja"||s==="en")l=s;}catch(e){}}
  lang=l||"en";
})();
const S={custom:null,seconds:30,sound:true,topic:null,spinning:false,rot:0,speaker:0,remaining:30,running:false,endAt:0,iv:null,lastTick:-1,view:"home",ov:null,msgKey:null};
try{const sv=JSON.parse(localStorage.getItem("topicpop")||"null");if(sv){if(Array.isArray(sv.players)&&sv.players.length)S.custom=sv.players.slice(0,8).map(String);if([15,30,45,60].includes(sv.seconds))S.seconds=sv.seconds;}}catch(e){}
function save(){try{localStorage.setItem("topicpop",JSON.stringify({players:S.custom,seconds:S.seconds}));}catch(e){}}
function t(k,p){let s=I18N[lang][k];if(s==null)s=k;if(p)for(const x in p)s=s.replace("{"+x+"}",p[x]);return s;}
function players(){return S.custom||I18N[lang].defaultPlayers;}

/* ---------- audio ---------- */
let AC=null;
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==="suspended")AC.resume();}catch(e){}return AC;}
function tone(f,d,type,vol,when){if(!S.sound)return;const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(when||0);o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.02);}catch(e){}}
function buzzer(){tone(160,.35,"square",.18,0);tone(160,.5,"square",.18,.42);}
function ding(){tone(784,.18,"sine",.2,0);tone(1047,.3,"sine",.2,.15);}
function tick(){tone(880,.07,"sine",.12,0);}

/* ---------- confetti ---------- */
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
function confetti(n){
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#fbbf24","#ec4899","#38bdf8","#fff","#a3e635"];
  for(let i=0;i<n;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,w:6+Math.random()*8,h:8+Math.random()*10,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+30);
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=null;cx.clearRect(0,0,cv.width,cv.height);}
}

/* ---------- wheel ---------- */
function buildWheel(){
  const n=10,step=360/n;let h="";
  const pt=(a,r)=>{const rad=a*Math.PI/180;return(100+r*Math.sin(rad)).toFixed(2)+" "+(100-r*Math.cos(rad)).toFixed(2);};
  for(let i=0;i<n;i++){
    const c=i*step,a0=c-step/2,a1=c+step/2;
    h+=`<path d="M100 100L${pt(a0,94)}A94 94 0 0 1 ${pt(a1,94)}Z" fill="${COLORS[i%3]}" stroke="#1f2937" stroke-width="2.5"/>`;
    h+=`<text transform="rotate(${c} 100 100)" x="100" y="38" text-anchor="middle" font-size="19">${EMOJI[i]}</text>`;
  }
  h+=`<circle cx="100" cy="100" r="94" fill="none" stroke="#1f2937" stroke-width="5"/>`;
  $("#wheel").innerHTML=h;
}
function spin(){
  if(S.spinning)return;
  audio();
  const n=10,step=36,k=Math.floor(Math.random()*n);
  const jitter=(Math.random()-.5)*20;
  const target=((360-k*step+jitter)%360+360)%360;
  const cur=((S.rot%360)+360)%360;
  const delta=(target-cur+360)%360;
  S.rot+=360*5+delta;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  const dur=reduce?900:4200;
  const w=$("#wheel");w.style.transitionDuration=dur+"ms";w.style.transform=`rotate(${S.rot}deg)`;
  S.spinning=true;S.topic=null;$("#startWrap").classList.add("hidden");renderTopic();renderSpin();
  setTimeout(()=>{S.spinning=false;S.topic=k;ding();renderTopic(true);renderSpin();$("#startWrap").classList.remove("hidden");},dur+80);
}

/* ---------- timer ---------- */
function setView(v){S.view=v;$("#home").classList.toggle("hidden",v!=="home");$("#talk").classList.toggle("hidden",v!=="talk");window.scrollTo(0,0);}
function startTalk(){
  audio();
  if(!players().length){showMsg("minP");return;}
  if(S.topic==null)return;
  S.speaker=0;setView("talk");beginTurn();
}
function beginTurn(){
  hideOverlay();
  S.remaining=S.seconds;S.endAt=Date.now()+S.seconds*1000;S.running=true;S.lastTick=-1;
  clearInterval(S.iv);S.iv=setInterval(onTick,100);
  renderTalk();
}
function onTick(){
  if(!S.running)return;
  S.remaining=Math.max(0,(S.endAt-Date.now())/1000);
  const c=Math.ceil(S.remaining);
  if(c<=5&&c>0&&c!==S.lastTick){S.lastTick=c;tick();}
  renderTimer();
  if(S.remaining<=0)finishTurn("time");
}
function togglePause(){
  if(S.ov)return;
  if(S.running){S.running=false;}else{S.endAt=Date.now()+S.remaining*1000;S.running=true;}
  renderTalk();
}
function finishTurn(kind){
  clearInterval(S.iv);S.running=false;
  const list=players();const name=list[S.speaker];const last=S.speaker>=list.length-1;
  S.ov={kind,idx:S.speaker,last};
  if(kind==="time")buzzer();else tick();
  confetti(kind==="time"?160:60);
  renderOverlay();$("#overlay").classList.remove("hidden");
  setTimeout(()=>{const b=$("#ovBtn");if(b)b.focus();},50);
  renderTalk();
}
function hideOverlay(){S.ov=null;$("#overlay").classList.add("hidden");}
function overlayNext(){
  const o=S.ov;if(!o)return;
  if(o.last){hideOverlay();setView("home");S.topic=null;renderTopic();$("#startWrap").classList.add("hidden");renderSpin();}
  else{S.speaker=o.idx+1;beginTurn();}
}
function quit(){clearInterval(S.iv);S.running=false;hideOverlay();setView("home");}

/* ---------- renderers ---------- */
function renderPlayers(){
  const ul=$("#chips");ul.innerHTML="";
  players().forEach((n,i)=>{
    const li=document.createElement("li");li.className="chip";
    const sp=document.createElement("span");sp.textContent=n;
    const b=document.createElement("button");b.type="button";b.textContent="✕";b.setAttribute("aria-label",t("removeAria",{n}));b.setAttribute("data-demo","player-remove");
    b.onclick=()=>removePlayer(i);
    li.append(sp,b);ul.append(li);
  });
}
function renderTimes(){
  document.querySelectorAll("#times button").forEach(b=>{const s=+b.dataset.sec;b.textContent=t("secs",{n:s});b.setAttribute("aria-pressed",String(s===S.seconds));});
}
function renderSpin(){
  const b=$("#spinBtn");b.disabled=S.spinning;
  b.textContent=S.spinning?t("spinning"):(S.topic==null&&!S.shown?t("spin"):t("spinAgain"));
  if(S.topic==null&&!S.spinning&&!S.hasSpun)b.textContent=t("spin");
}
function renderTopic(pop){
  const box=$("#topicBox");
  if(S.topic==null){box.className="mt topic hint";box.textContent=t("hint");return;}
  S.hasSpun=true;
  box.className="mt topic"+(pop?" pop":"");
  box.innerHTML="";
  const e=document.createElement("span");e.className="em";e.textContent=EMOJI[S.topic];
  const s=document.createElement("span");s.textContent=I18N[lang].topics[S.topic];
  box.append(e,s);
}
function renderTimer(){
  const r=Math.max(0,S.remaining/S.seconds);
  $("#ring").setAttribute("stroke-dashoffset",(377*(1-r)).toFixed(1));
  $("#num").textContent=Math.ceil(S.remaining);
  $("#ringWrap").classList.toggle("hurry",S.running&&S.remaining<=5&&S.remaining>0);
}
function renderTalk(){
  if(S.topic==null)return;
  const tb=$("#talkTopic");tb.innerHTML="";
  const e=document.createElement("span");e.className="em";e.textContent=EMOJI[S.topic];
  const s=document.createElement("span");s.textContent=I18N[lang].topics[S.topic];
  tb.append(e,s);
  const list=players();
  $("#speaker").textContent=(list[S.speaker]||"")+" 🎤";
  $("#pauseBtn").textContent=S.running?t("pause"):t("resume");
  const od=$("#order");od.innerHTML="";
  list.forEach((n,i)=>{const sp=document.createElement("span");sp.textContent=n;if(i<S.speaker)sp.className="done";else if(i===S.speaker)sp.className="now";od.append(sp);});
  renderTimer();
}
function renderOverlay(){
  const o=S.ov;if(!o)return;
  const list=players();const name=list[o.idx]||"";
  $("#ovIcon").textContent=o.kind==="time"?"⏰":"👏";
  $("#ovTitle").textContent=o.last?t("allDone"):t(o.kind==="time"?"timeup":"early");
  $("#ovText").textContent=o.last?(t("thanks",{n:name})+" "+t("allDoneText")):t("thanks",{n:name});
  $("#ovBtn").textContent=o.last?t("again"):t("nextTurn",{n:list[o.idx+1]||""});
}
function renderSound(){const b=$("#soundBtn");b.textContent=S.sound?"🔊":"🔇";b.setAttribute("aria-pressed",String(S.sound));b.setAttribute("aria-label",t(S.sound?"sndOn":"sndOff"));}
function showMsg(k){S.msgKey=k;$("#msg").textContent=k?t(k):"";if(k)setTimeout(()=>{if(S.msgKey===k){S.msgKey=null;$("#msg").textContent="";}},2500);}

function applyLang(){
  document.documentElement.lang=lang;
  document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.i18nAria)));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  renderPlayers();renderTimes();renderSpin();renderTopic();renderTalk();renderOverlay();renderSound();
  if(S.msgKey)$("#msg").textContent=t(S.msgKey);
}

/* ---------- actions ---------- */
function ensureCustom(){if(!S.custom)S.custom=I18N[lang].defaultPlayers.slice();}
function addPlayer(name){
  name=name.trim();
  if(!name){showMsg("needName");return false;}
  ensureCustom();
  if(S.custom.length>=8){showMsg("maxP");return false;}
  if(S.custom.includes(name)){showMsg("dup");return false;}
  S.custom.push(name);save();renderPlayers();return true;
}
function removePlayer(i){
  ensureCustom();
  if(S.custom.length<=1){showMsg("minP");return;}
  S.custom.splice(i,1);save();renderPlayers();
}

$("#addForm").addEventListener("submit",e=>{e.preventDefault();const i=$("#nameIn");if(addPlayer(i.value)){i.value="";}i.focus();});
document.querySelectorAll("#times button").forEach(b=>b.onclick=()=>{S.seconds=+b.dataset.sec;save();renderTimes();});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("lang",lang);}catch(e){}applyLang();});
$("#soundBtn").onclick=()=>{S.sound=!S.sound;renderSound();if(S.sound){audio();ding();}};
$("#spinBtn").onclick=spin;
$("#startTalk").onclick=startTalk;
$("#pauseBtn").onclick=togglePause;
$("#nextBtn").onclick=()=>{if(!S.ov)finishTurn("skip");};
$("#quitBtn").onclick=quit;
$("#ovBtn").onclick=overlayNext;

buildWheel();
applyLang();
</script>
</body>
</html>
